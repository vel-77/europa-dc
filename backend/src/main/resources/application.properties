spring.application.name=europa-backend

# Local settings live in backend/.env (see .env.example); real environment variables win.
spring.config.import=optional:file:.env[.properties]

# Only the Next.js frontend talks to this service, so listen on localhost by default.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8090}

europa.admin-password=${ADMIN_PASSWORD:}
europa.session-secret=${SESSION_SECRET:}
europa.data-dir=${DATA_DIR:./data}

# An embedded H2 database stored in the data folder. To use another database,
# set SPRING_DATASOURCE_URL (plus username and password) and add its driver to pom.xml.
spring.datasource.url=jdbc:h2:file:${europa.data-dir}/europa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Inquiry attachments are the largest uploads: up to five files of 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB
