# Production: Caddy (HTTPS) -> Next.js frontend -> Java backend.
# Settings come from .env next to this file (see deploy/.env.example).
# Start or update with: docker compose up -d --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    volumes:
      # Database, uploaded photos and inquiry attachments. Back this up.
      - backend-data:/data
    healthcheck:
      # Healthy once it serves content, i.e. after start-up and first-run seeding.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /api/site HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8090
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/icon.png"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-redirect.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates; keeping them avoids Let's Encrypt rate limits on restarts.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  backend-data:
  caddy-data:
  caddy-config:
